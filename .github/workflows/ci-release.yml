name: Verify and release Paper 26.3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and package
        run: ./gradlew --no-daemon clean build
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WaystoneWarps-Paper-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WaystoneWarps-Paper-26.3
          path: release
      - name: Publish tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd release
          sha256sum *.jar > SHA256SUMS.txt
          tag="paper-26.3-${COMMIT:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" *.jar SHA256SUMS.txt --target "$COMMIT" \
              --title "Paper 26.3 · build $RUN_NUMBER" --generate-notes --latest
          fi
