name: Unit Test Gradle

on:
  push:
    branches:
      - main
      - staging
      - release/*
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper-api:
          - '1.21.8-R0.1-SNAPSHOT'
          - '26.1.2.build.74-stable'
          - '26.2.build.121-stable'
          - '26.3.build.135-beta'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Test with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -PpaperApiVersion=${{ matrix.paper-api }}
